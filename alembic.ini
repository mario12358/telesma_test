# Alembic CLI configuration. The database path comes from LEKTURY_DB_PATH (see app/config.py);
# the application itself runs `upgrade head` at startup, so the CLI is only needed to author
# new revisions: `alembic revision --autogenerate -m "<description>"`.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

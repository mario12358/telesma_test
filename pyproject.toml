[project]
name = "lista-lektur"
version = "0.1.0"
description = "Lista lektur — local, single-user reading list"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["telesma", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Polish UI texts legitimately use en dashes and « » quotes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser e2e tests run only on request: `pytest -m e2e --browser-channel chrome`.
addopts = "-p no:cacheprovider -m 'not e2e'"
markers = ["e2e: browser end-to-end tests (Playwright)"]

[project]
name = "lista-lektur"
version = "0.1.0"
description = "Lista lektur — local, single-user reading list"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["telesma", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["e2e: browser end-to-end tests (Playwright)"]

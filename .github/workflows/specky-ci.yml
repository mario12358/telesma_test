# Source: the Specky plugin's templates/specky-ci.yml (Specky v0.45.0), adapted to Python 3.12 in task 1.1.
# Contract with Specky — these things must stay:
#   - the artifact with the JUnit XML reports has "junit" in its name
#   - the test steps run with `continue-on-error: true`: the report has to exist for a red test too,
#     otherwise Specky sees "CI did not run it" instead of ❌ on the criterion
#   - no `paths:` filter in `on:` — a filtered-out run gives Specky no report to read
#   - `push: branches: [main]` stays: Specky also collects evidence from the run on the default
#     branch after the merge
#   - a criterion demo (recording/screenshot) is the artifact "specky-demo-<criterion_id>", built from
#     demos/<criterion_id>/
#
# Specky reads the JUnit report from this workflow and for every criterion marked in the code
# with the comment `specky: crit <criterion_id>` (the line above the test) shows ✅/❌ on the PR.
# The job name ("test") is one of the "Required checks" in telesma/config.md.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install the Chromium browser for e2e tests
        run: python -m playwright install --with-deps chromium

      - name: Run unit and integration tests
        run: |
          mkdir -p reports
          pytest -m "not e2e" --junitxml=reports/junit.xml
        continue-on-error: true

      - name: Run e2e tests on Chromium
        run: pytest -m e2e --browser chromium --junitxml=reports/junit-e2e.xml
        continue-on-error: true

      # --- Contract 1: JUnit report as an artifact with "junit" in its name -------
      - name: Upload JUnit reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: junit-reports
          path: reports/*.xml
          retention-days: 14
          if-no-files-found: error

      - name: Lint with ruff
        run: ruff check .

      # The job itself must still go red when tests fail — continue-on-error only keeps the report:
      - name: Fail when any test failed
        run: test -z "$(grep -l '<failure\|<error' reports/*.xml 2>/dev/null)"
